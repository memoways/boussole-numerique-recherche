server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Coolify termine HTTPS devant ce serveur interne. Les éventuelles redirections
    # doivent rester relatives afin de ne jamais exposer :8080 au navigateur.
    absolute_redirect off;
    port_in_redirect off;

    # Si l’hôte public canonique arrive encore avec le port interne, ramener
    # immédiatement vers le domaine HTTPS. Le test local Docker conserve son
    # hôte 127.0.0.1:8080 afin de ne jamais suivre une redirection externe.
    if ($http_host ~* "^boussole-culture-recherche\.memoways\.com:8080$") {
        return 308 https://boussole-culture-recherche.memoways.com$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Les fichiers avec empreinte Vite sont immuables ; index.html reste toujours actualisable.
    location ~* \.(?:css|js|mjs|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Endpoint interne, sans redirection et sans dépendance DNS ou TLS :
    # utilisé exclusivement par le HEALTHCHECK Docker/Coolify du portail.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # URLs historiques : redirections permanentes vers les destinations canoniques.
    location = /description-projet { return 301 /projet; }
    location = /gouvernance { return 301 /methode; }
    location = /references-inspirantes { return 301 /ressources/references-inspirantes; }
    location = /etude-complete { return 301 /ressources/etude-complete; }
    location = /etat-des-lieux { return 301 /ressources/etat-des-lieux; }
    location = /analyse-outils { return 301 /ressources/analyse-outils; }
    location = /sources { return 301 /ressources/sources; }
    location = /synthese-documents { return 301 /ressources/synthese-documents; }

    # Les pages partenaires ont un chemin canonique sans slash terminal. Les
    # paramètres de pagination (?slide=…) restent conservés dans la redirection.
    location = /partenaires/ { return 308 /partenaires$is_args$args; }
    location = /partenaires/presentation/ { return 308 /partenaires/presentation$is_args$args; }
    location = /partenaires/questionnaire/ { return 308 /partenaires/questionnaire$is_args$args; }

    # Les routes publiques disposent d’un index HTML statique, complété par React après chargement.
    # Une adresse inconnue produit une vraie 404 plutôt qu’un fallback SPA « soft 404 ».
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
